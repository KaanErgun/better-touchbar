# Installed as /etc/systemd/system/tiny-dfr.service.d/50-touchbar.conf.
# touchbar.service owns the Touch Bar. tiny-dfr is started by udev whenever the touchpad input
# appears, so it cannot simply be disabled (and its unit lives in /etc, so it cannot be masked
# either); instead it only starts when touchbar-fallback.service has set the flag.
# Back to tiny-dfr for good: delete this file, `systemctl disable --now touchbar`, start tiny-dfr.
[Unit]
ConditionPathExists=/run/touchbar-fallback
